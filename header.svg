<svg fill="none" viewBox="0 0 900 280" width="900" height="280" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="900" height="280">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .root {
          width: 900px;
          height: 280px;
          background: #050a0f;
          position: relative;
          overflow: hidden;
          font-family: 'Courier New', Courier, monospace;
        }

        /* Animated grid */
        .grid {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(0,245,255,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,245,255,0.04) 1px, transparent 1px);
          background-size: 44px 44px;
          animation: gridScroll 20s linear infinite;
        }
        @keyframes gridScroll {
          from { background-position: 0 0; }
          to   { background-position: 44px 44px; }
        }

        /* Scanlines */
        .scan {
          position: absolute;
          inset: 0;
          background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(0,245,255,0.015) 3px,
            rgba(0,245,255,0.015) 4px
          );
          pointer-events: none;
        }

        /* Top accent line */
        .top-line {
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 2px;
          background: linear-gradient(90deg, transparent 0%, #00f5ff 30%, #ff00aa 70%, transparent 100%);
          animation: pulse-line 3s ease-in-out infinite;
        }
        @keyframes pulse-line {
          0%, 100% { opacity: 0.4; }
          50% { opacity: 1; }
        }

        /* Bottom accent line */
        .bot-line {
          position: absolute;
          bottom: 0; left: 0; right: 0;
          height: 1px;
          background: linear-gradient(90deg, transparent, #7fff00, transparent);
          animation: pulse-line 3s ease-in-out infinite reverse;
        }

        /* Corner brackets */
        .corner {
          position: absolute;
          width: 20px; height: 20px;
          border-color: #00f5ff;
          border-style: solid;
          opacity: 0.6;
        }
        .tl { top: 8px; left: 8px;  border-width: 2px 0 0 2px; }
        .tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
        .bl { bottom: 8px; left: 8px;  border-width: 0 0 2px 2px; }
        .br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

        /* Main content */
        .content {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 60px;
        }

        /* Greeting */
        .greeting {
          font-size: 11px;
          letter-spacing: 5px;
          text-transform: uppercase;
          color: #00f5ff;
          opacity: 0;
          animation: fadeUp 0.6s ease 0.2s forwards;
          margin-bottom: 6px;
        }

        /* Name with typewriter */
        .name-wrap {
          overflow: hidden;
          margin-bottom: 4px;
        }

        .name {
          font-size: 54px;
          font-weight: 900;
          font-family: 'Courier New', monospace;
          letter-spacing: 4px;
          line-height: 1.05;
          display: inline-block;
          background: linear-gradient(90deg, #00f5ff 0%, #7fff00 45%, #ff00aa 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          white-space: nowrap;
          overflow: hidden;
          width: 0;
          animation: typeWriter 1.4s steps(17) 0.5s forwards;
          border-right: 3px solid #00f5ff;
        }

        @keyframes typeWriter {
          from { width: 0; }
          to   { width: 17ch; }
        }

        /* Alias */
        .alias {
          font-size: 13px;
          color: #4a6572;
          letter-spacing: 3px;
          opacity: 0;
          animation: fadeUp 0.6s ease 1.8s forwards;
          margin-bottom: 18px;
        }
        .alias span { color: #ff00aa; }

        /* Tags row */
        .tags {
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          opacity: 0;
          animation: fadeUp 0.6s ease 2.0s forwards;
        }

        .tag {
          padding: 4px 12px;
          border-radius: 3px;
          font-size: 10px;
          letter-spacing: 2px;
          text-transform: uppercase;
          border: 1px solid;
          white-space: nowrap;
        }
        .t1 { color: #00f5ff; border-color: rgba(0,245,255,0.35); background: rgba(0,245,255,0.07); }
        .t2 { color: #ff00aa; border-color: rgba(255,0,170,0.35); background: rgba(255,0,170,0.07); }
        .t3 { color: #7fff00; border-color: rgba(127,255,0,0.35);  background: rgba(127,255,0,0.07);  }
        .t4 { color: #ffbd2e; border-color: rgba(255,189,46,0.35); background: rgba(255,189,46,0.07); }

        /* Floating particles */
        .particle {
          position: absolute;
          width: 2px; height: 2px;
          background: #00f5ff;
          border-radius: 50%;
          animation: float linear infinite;
          opacity: 0.4;
        }
        @keyframes float {
          0%   { transform: translateY(280px) translateX(0); opacity: 0; }
          10%  { opacity: 0.4; }
          90%  { opacity: 0.4; }
          100% { transform: translateY(-10px) translateX(20px); opacity: 0; }
        }

        /* Status dot */
        .status {
          position: absolute;
          top: 20px; right: 30px;
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 9px;
          letter-spacing: 2px;
          color: #7fff00;
          opacity: 0;
          animation: fadeUp 0.5s ease 2.4s forwards;
        }
        .dot {
          width: 6px; height: 6px;
          border-radius: 50%;
          background: #7fff00;
          animation: blink-dot 1.5s ease-in-out infinite;
        }
        @keyframes blink-dot {
          0%,100% { opacity: 1; box-shadow: 0 0 4px #7fff00; }
          50%     { opacity: 0.3; box-shadow: none; }
        }

        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(8px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        /* Vertical accent line */
        .v-line {
          position: absolute;
          left: 46px; top: 30px; bottom: 30px;
          width: 1px;
          background: linear-gradient(180deg, transparent, #00f5ff 30%, #ff00aa 70%, transparent);
          opacity: 0.3;
        }
      </style>

      <div class="root">
        <div class="grid"></div>
        <div class="scan"></div>
        <div class="top-line"></div>
        <div class="bot-line"></div>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="v-line"></div>

        <!-- Particles -->
        <div class="particle" style="left:5%;  animation-duration:8s;  animation-delay:0s;"></div>
        <div class="particle" style="left:15%; animation-duration:12s; animation-delay:2s;  background:#ff00aa;"></div>
        <div class="particle" style="left:70%; animation-duration:10s; animation-delay:4s;  background:#7fff00;"></div>
        <div class="particle" style="left:85%; animation-duration:7s;  animation-delay:1s;"></div>
        <div class="particle" style="left:55%; animation-duration:14s; animation-delay:6s;  background:#ff00aa;"></div>
        <div class="particle" style="left:92%; animation-duration:9s;  animation-delay:3s;  background:#7fff00;"></div>

        <div class="status">
          <div class="dot"></div>
          OPEN TO COLLABS
        </div>

        <div class="content">
          <div class="greeting">▸ Hello World, I'm</div>
          <div class="name-wrap">
            <div class="name">RAGIL AMIRZAKY</div>
          </div>
          <div class="alias">aka <span>Tenzly</span> · <span style="color:#00f5ff">Lapnes</span></div>
          <div class="tags">
            <span class="tag t1">⚡ Backend Engineer</span>
            <span class="tag t2">🛡️ SecOps</span>
            <span class="tag t3">🏗️ Infra Architect</span>
            <span class="tag t4">🏆 CP @ UNTAN</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
